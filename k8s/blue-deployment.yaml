apiVersion: apps/v1
kind: Deployment
metadata:
  name: vle8-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vle8-blue
  template:
    metadata:
      labels:
        app: vle8-blue
    spec:
      containers:
      - name: vle8-blue
        image: vle8-blue:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 80
